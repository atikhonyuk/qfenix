name: Build patched QFenix for Intel macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - name: Checkout patched source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install libusb libxml2 pkg-config help2man

      - name: Build QFenix
        run: |
          make clean || true
          make -j"$(sysctl -n hw.ncpu)"

      - name: Bundle dylibs
        run: |
          mkdir -p artifact/lib
          cp qfenix artifact/qfenix-patched-intel

          cp "$(brew --prefix libusb)/lib/libusb-1.0.0.dylib" artifact/lib/
          cp "$(brew --prefix libxml2)/lib/libxml2.2.dylib" artifact/lib/

          install_name_tool -change \
            "$(brew --prefix libusb)/lib/libusb-1.0.0.dylib" \
            "@executable_path/lib/libusb-1.0.0.dylib" \
            artifact/qfenix-patched-intel

          install_name_tool -change \
            "$(brew --prefix libxml2)/lib/libxml2.2.dylib" \
            "@executable_path/lib/libxml2.2.dylib" \
            artifact/qfenix-patched-intel

          chmod +x artifact/qfenix-patched-intel

      - name: Verify
        run: |
          file artifact/qfenix-patched-intel
          otool -L artifact/qfenix-patched-intel
          otool -l artifact/qfenix-patched-intel | grep -A3 LC_BUILD_VERSION || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qfenix-patched-intel-sonoma
          path: artifact/
